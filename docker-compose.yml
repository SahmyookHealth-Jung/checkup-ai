# 로컬 개발용 인프라. 값은 같은 폴더의 .env에서 읽는다 (.env.example 참고).
# Ollama는 컨테이너가 아니라 macOS에 직접 설치해 쓴다 (docs/adr/0001 참고).
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    container_name: checkup-postgres
    restart: unless-stopped                      # Docker Desktop이 재시작돼도 다시 뜬다
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-checkup}
      POSTGRES_USER: ${POSTGRES_USER:-checkup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # 내 Mac에서만 접속 가능
    volumes:
      - pgdata:/var/lib/postgresql               # PostgreSQL 18 이미지는 이 경로를 마운트한다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
