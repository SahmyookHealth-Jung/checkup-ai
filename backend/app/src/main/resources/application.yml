spring:
  application:
    name: checkup-ai

  # 값은 저장소 루트 .env에서 주입된다 (.env.example 참고)
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:checkup}
    username: ${POSTGRES_USER:checkup}
    password: ${POSTGRES_PASSWORD}

  flyway:
    placeholders:
      # 기능 2 읽기 전용 계정 비밀번호 (V4 마이그레이션, ADR 0013). 값은 .env에만 둔다
      statsReaderPassword: ${STATS_READER_PASSWORD}

  ai:
    # 모델 공급자 선택. 코드는 ChatModel/EmbeddingModel 인터페이스만 쓰므로 여기만 바꾸면 교체된다.
    model:
      chat: anthropic                      # 기본 Haiku 5.5 (ADR 0005). 로컬 모델은 오프라인 프로필로만 켠다 (application-offline.yml)
                                           # 공급자만 바꾸면 자동 재시도·재요청 설정이 로컬 모델에 맞지 않는다 (2026-11-10 리뷰)
      embedding: ollama                    # 임베딩은 로컬 bge-m3 고정 (벡터 차원이 바뀌면 재적재 필요)

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: bge-m3                      # Spring AI 2.0 키. 1.x의 embedding.options.model은 deprecated
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3:4b}   # 오프라인 모드(application-offline.yml)에서만 채팅에 쓴다 (ADR 0005)
        temperature: 0                     # 추출은 재현성이 중요하다
        think: false                       # 사고 과정 출력 끔 (CPU에서 토큰 낭비)
        num-ctx: 8192                      # 결과지 + 출력 JSON이 기본 4096을 넘을 수 있다

    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-5-5}
        options:
          # disabled | adaptive (AnthropicThinkingConfig가 변환). 모델 비교는 qwen3(think: false)와 같은 조건으로 끈다.
          # temperature는 보내지 않는다: Haiku 5.5는 기본값이 아닌 sampling 값을 400으로 거절한다.
          thinking: ${ANTHROPIC_THINKING:disabled}

    # Spring AI 자동 재시도. 기본값(10회, 2초×5배씩 증가, 상한 없음)은 로컬 CPU 모델에 위험하다:
    # 시간 제한에 걸린 무거운 요청을 Ollama에 10번 다시 쌓는다 (2026-11-09 실측).
    # 기본(API 공급자)은 3, 오프라인 모드(로컬 Ollama)는 재시도 없음(1, application-offline.yml).
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:3}
      backoff:
        max-interval: 30s

    vectorstore:
      pgvector:
        # 테이블은 Flyway V3가 만든다 (ADR 0007). 청크 id는 사람이 읽을 수 있는 문자열이다 (예: kdca-6765-definition-1)
        initialize-schema: false
        schema-validation: true            # 기동할 때 테이블·컬럼이 PgVectorStore 형식과 맞는지 확인한다
        table-name: guideline_chunk
        id-type: text
        dimensions: 1024                   # bge-m3 출력 차원

  # 외부 HTTP 호출(Ollama, Anthropic) 시간 제한. API 응답이 무한정 묶이지 않게 하는 용도다.
  # 주의 (2026-11-09 실측): 연결이 끊겨도 Ollama는 생성을 끝까지 계속한다(CPU를 아끼지 못함).
  # 그래서 폭주를 막는 진짜 방어선은 아래 출력 상한(max-tokens)이다. CPU에서 정상 추출은 5분 안팎.
  http:
    clients:
      read-timeout: 15m

checkupai:
  privacy:
    redaction-enabled: true   # 외부 전송 전 식별정보 제거 (ADR 0006). 끄는 것은 영향 측정 실험용뿐
  llm:
    # 모델별 가격 (100만 토큰당 달러). LLM 호출 기록의 비용 계산에 쓴다 (ADR 0006).
    # 출처: Anthropic 가격표 (claude-api 참고 자료, 2026-11-03 기준). Haiku 5.5는 입력 10만 토큰 이하 요청 가격이다
    # (초과하면 입력 $0.50 / 출력 $2.50). 로컬 모델은 0. 콜론이 든 키는 대괄호로 감싼다.
    pricing:
      claude-haiku-5-5: { input: 0.10, output: 0.50 }
      "[qwen3:4b]": { input: 0, output: 0 }
    budget:
      # 데모 하루 예산 (ADR 0012 3절). 오늘 LLM 비용 합이 이 값 이상이면 데모 호출을 429로 막는다. 0이면 끈다
      daily-usd: ${DEMO_DAILY_BUDGET_USD:0.20}
  guidelines:
    # 해설 근거 청크 파일 (eval/rag/build_chunks.py가 만든다). bootRun의 작업 폴더는 backend/app이다
    chunks-file: ${GUIDELINE_CHUNKS_FILE:../../data/guidelines/chunks/chunks.jsonl}
    # 벡터 검색 설정. 판정 해설은 2026-11-11부터 검색하지 않고 조회한다 (ADR 0010 1절, explanation/evidence-lookup.json).
    # 지금은 검색 평가(GuidelineController)만 쓰고, 다음에 만들 후속 질문 경로가 쓴다
    top-k: 4                  # 벡터 상위 k개 (ADR 0007 3절)
    min-similarity: 0.5       # 이보다 유사도가 낮은 근거는 버린다
  explanation:
    max-items: 8              # 해설할 항목 수 상한 (질환의심 먼저)
    max-tokens: 4000          # 2026-11-10: 8개 항목 해설이 2,000토큰에서 잘렸다
  eval:
    # 저장한 추출 결과로 해설만 돌리는 평가 API (ADR 0008). 추출 검증을 거치지 않은 값이 LLM에 가므로 공개 배포에서는 끈다
    endpoints-enabled: ${EVAL_ENDPOINTS_ENABLED:true}
  stats:
    # 기능 2 Text-to-SQL (ADR 0013). LLM이 쓴 SQL은 stats 스키마만 SELECT할 수 있는 읽기 전용 계정으로 실행한다
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:checkup}
    username: stats_reader
    password: ${STATS_READER_PASSWORD}
    max-rows: 200              # 결과 행 상한
    min-group-size: 10         # 사람 수가 이보다 적은 집단의 값은 숨긴다
    max-tokens: 1200
  demo:
    # 화면의 합성 샘플 결과지 폴더 (PDF는 gitignore, 생성기로 다시 만든다). 공개 데모는 샘플만 쓴다 (ADR 0007 7절)
    samples-dir: ${DEMO_SAMPLES_DIR:../../data/synthetic/extraction/v1}
  extraction:
    pipeline: ${EXTRACTION_PIPELINE:validated}   # baseline | validated (ADR 0003)
    first-pass-max-tokens: ${EXTRACTION_FIRST_PASS_MAX_TOKENS:2500}   # 정상 출력 1,400~1,800토큰(qwen3). 반복 루프 폭주 방지
    retry-max-tokens: ${EXTRACTION_RETRY_MAX_TOKENS:600}
    retry-batch-size: 4                          # 누락 조각이 많으면 4개씩 나눠 재요청 (v2.3)
    retry-enabled: false                         # Haiku에는 재요청이 이득 없음 (ADR 0005). 오프라인 모드에서 켠다. 잘린 출력은 예외
    # 결과를 바꾸는 설정 요약 (평가 캐시 키). 위 thinking, 아래 식별정보 제거와 같은 값
    model-settings: thinking=${ANTHROPIC_THINKING:disabled},redaction=${checkupai.privacy.redaction-enabled}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
